<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Satellite illustration</title>
  <desc id="desc">A small satellite floating above the blue curve of Earth.</desc>
  <defs>
    <radialGradient id="space" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#172d49"/><stop offset="1" stop-color="#050914"/>
    </radialGradient>
    <linearGradient id="earth" x2="0" y2="1">
      <stop stop-color="#23caff"/><stop offset=".16" stop-color="#087bb5"/><stop offset="1" stop-color="#071d3b"/>
    </linearGradient>
    <linearGradient id="panel" x2="0" y2="1">
      <stop stop-color="#43d8ff"/><stop offset="1" stop-color="#1472b5"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="9" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="420" fill="url(#space)"/>
  <g fill="#d8edff" opacity=".7"><circle cx="125" cy="75" r="2"/><circle cx="280" cy="132" r="1.5"/><circle cx="778" cy="72" r="2"/><circle cx="864" cy="182" r="1.4"/><circle cx="694" cy="117" r="1.3"/><circle cx="405" cy="67" r="1.2"/></g>
  <path d="M-40 385 Q480 95 1000 385 L1000 460 -40 460Z" fill="url(#earth)"/>
  <path d="M-35 386 Q480 96 995 386" fill="none" stroke="#7de7ff" stroke-width="5" opacity=".8" filter="url(#glow)"/>
  <g transform="translate(480 205)" stroke="#c8d8e8" stroke-width="4" stroke-linejoin="round">
    <rect x="-32" y="-28" width="64" height="56" rx="8" fill="#d7e3eb"/>
    <rect x="-21" y="-18" width="42" height="36" rx="3" fill="#7d94a8"/>
    <path d="M-30 -4h60M-8 -26v52" fill="none" stroke="#d3f4ff" stroke-width="2"/>
    <path d="M-32 -10h-92v20h92M32 -10h92v20H32" fill="url(#panel)"/>
    <path d="M-101 -10v20m-15-20v20M101 -10v20m15-20v20" fill="none" stroke="#9be9ff" stroke-width="2"/>
    <path d="M0 -28v-26m-13 -1h26" fill="none" stroke="#d7e3eb" stroke-width="4"/>
  </g>
</svg>
